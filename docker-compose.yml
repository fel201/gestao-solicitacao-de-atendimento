services:
  db:
    image: postgres:16-alpine
    container_name: solicitacao-db
    environment:
      POSTGRES_DB: solicitacao_atendimento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solicitacao-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: solicitacao_atendimento
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: solicitacao-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
